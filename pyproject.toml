[tool.poetry]
name = "wildberries-sentiment-mlops"
version = "1.0.0"
description = "Reproducible sentiment analysis service for Russian Wildberries reviews"
authors = ["Student"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pandas = "2.3.3"
numpy = "2.2.6"
scikit-learn = "1.8.0"
joblib = "1.5.3"
mlflow = "3.10.1"
fastapi = "0.135.1"
uvicorn = { version = "0.42.0", extras = ["standard"] }
pydantic = "2.12.5"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
httpx = "0.28.1"
ruff = "0.16.9"
pytest-cov = "7.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
omit = ["*/train.py", "*/prepare.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
